<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Nordic Admin - Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Login Screen -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-sm">
            <h1 class="text-2xl font-bold text-center mb-6">Royal Nordic Admin</h1>
            <form id="loginForm">
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">Email</label>
                    <input type="email" id="email" class="w-full p-3 border rounded-lg" placeholder="admin@royalnordic.fi" required>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">Password</label>
                    <input type="password" id="password" class="w-full p-3 border rounded-lg" placeholder="Password" required>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">Secure Key</label>
                    <input type="password" id="secureKey" class="w-full p-3 border rounded-lg" placeholder="Security key" required>
                </div>
                <div class="mb-4">
                    <label class="flex items-center">
                        <input type="checkbox" id="rememberMe" class="mr-2">
                        Remember me
                    </label>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700">
                    Login
                </button>
            </form>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel" class="hidden">
        <div class="bg-blue-600 text-white p-4">
            <div class="flex justify-between items-center">
                <h1 class="text-xl font-bold">Royal Nordic Admin</h1>
                <button onclick="logout()" class="bg-red-600 px-4 py-2 rounded hover:bg-red-700">
                    Logout
                </button>
            </div>
        </div>
        <div class="p-6">
            <h2 class="text-2xl font-bold mb-4">Welcome to Admin Panel!</h2>
            <p>You are successfully logged in.</p>
        </div>
    </div>

    <script>
        // Load saved credentials
        document.addEventListener('DOMContentLoaded', function() {
            const savedEmail = localStorage.getItem('royalnordic_admin_email');
            const savedPassword = localStorage.getItem('royalnordic_admin_password');
            const savedSecureKey = localStorage.getItem('royalnordic_admin_securekey');
            const rememberMe = localStorage.getItem('royalnordic_admin_remember') === 'true';

            if (rememberMe && savedEmail && savedPassword && savedSecureKey) {
                document.getElementById('email').value = savedEmail;
                document.getElementById('password').value = savedPassword;
                document.getElementById('secureKey').value = savedSecureKey;
                document.getElementById('rememberMe').checked = true;
            }
        });

        // Login
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const secureKey = document.getElementById('secureKey').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            
            console.log('Login attempt:', { email, password: password.substring(0, 3) + '***', secureKey: secureKey.substring(0, 3) + '***' });
            
            // Check credentials
            if (email === 'admin@royalnordic.fi' && password === 'Rollonortsu8889' && secureKey === '568907') {
                console.log('Login successful!');
                
                // Save credentials if remember me is checked
                if (rememberMe) {
                    localStorage.setItem('royalnordic_admin_email', email);
                    localStorage.setItem('royalnordic_admin_password', password);
                    localStorage.setItem('royalnordic_admin_securekey', secureKey);
                    localStorage.setItem('royalnordic_admin_remember', 'true');
                } else {
                    localStorage.removeItem('royalnordic_admin_email');
                    localStorage.removeItem('royalnordic_admin_password');
                    localStorage.removeItem('royalnordic_admin_securekey');
                    localStorage.removeItem('royalnordic_admin_remember');
                }
                
                // Show admin panel
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
            } else {
                console.log('Login failed!');
                alert('Invalid credentials!');
            }
        });

        // Logout
        function logout() {
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
