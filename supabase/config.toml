# Production Auth settings for Royal Nordic Rewards (pushed with `supabase config push`)
[auth]
site_url = "https://royalnordic.fi"
additional_redirect_urls = [
  "https://royalnordic.fi/referralprogram/verify",
  "https://royalnordic.fi/referralprogram/reset-password",
  "https://royalnordic.fi/admin/sharedbookings",
  "https://royalnordic.fi/admin/sharedbookings/**",
  "https://royalnordic.fi/**",
  "https://admin.royalnordic.fi/**",
  "http://localhost:5173/**",
  "http://127.0.0.1:5173/**",
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**"
]

[auth.email]
enable_confirmations = true

# Production Auth email delivery (applied via Dashboard / Management API / config push
# only with explicit approval). Preferred production path: Send Email hook → Resend
# (edge function auth-send-email) using existing RESEND_API_KEY.
# Optional SMTP alternative (requires plaintext Resend API key in Auth SMTP settings):
# [auth.email.smtp]
# enabled = true
# host = "smtp.resend.com"
# port = 465
# user = "resend"
# pass = "env(RESEND_API_KEY)"
# admin_email = "noreply@royalnordic.fi"
# sender_name = "Royal Nordic"

[auth.email.template.confirmation]
subject = "Confirm your Royal Nordic Rewards email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Royal Nordic Rewards password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new Royal Nordic email"
content_path = "./supabase/templates/email_change.html"

[functions.auth-send-email]
enabled = true
verify_jwt = false
entrypoint = "./functions/auth-send-email/index.ts"

[functions.contact-form]
enabled = true
verify_jwt = true
import_map = "./functions/contact-form/deno.json"
entrypoint = "./functions/contact-form/index.ts"

[functions.omega-operational-read]
enabled = true
verify_jwt = false

[functions.stripe-webhook]
enabled = true
verify_jwt = false

[functions.get-checkout-confirmation]
enabled = true
verify_jwt = false
entrypoint = "./functions/get-checkout-confirmation/index.ts"

[functions.mature-referral-credits]
enabled = true
verify_jwt = false
entrypoint = "./functions/mature-referral-credits/index.ts"

[functions.submit-partner-application]
enabled = true
verify_jwt = false
entrypoint = "./functions/submit-partner-application/index.ts"

[functions.admin-partner-application]
enabled = true
verify_jwt = true
entrypoint = "./functions/admin-partner-application/index.ts"

[functions.admin-shared-booking-operator]
enabled = true
verify_jwt = true
entrypoint = "./functions/admin-shared-booking-operator/index.ts"

[functions.process-notification-outbox]
enabled = true
verify_jwt = false
entrypoint = "./functions/process-notification-outbox/index.ts"
