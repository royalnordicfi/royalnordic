# Production Auth settings for Royal Nordic Rewards (pushed with `supabase config push`)
[auth]
site_url = "https://royalnordic.fi"
additional_redirect_urls = [
  "https://royalnordic.fi/referralprogram/verify",
  "https://royalnordic.fi/referralprogram/reset-password",
  "https://royalnordic.fi/**",
  "http://localhost:5173/**",
  "http://127.0.0.1:5173/**",
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**"
]

[auth.email]
enable_confirmations = true

[functions.contact-form]
enabled = true
verify_jwt = true
import_map = "./functions/contact-form/deno.json"
# Uncomment to specify a static file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/contact-form/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/contact-form/*.html" ]

[functions.omega-operational-read]
enabled = true
verify_jwt = false

[functions.stripe-webhook]
enabled = true
verify_jwt = false
